on:
  push:
    branches-ignore: [main]

name: Test

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  renovate-validate:
    name: Validate with bot version
    runs-on: podman-nix
    container: renovate/renovate:44.264.1@sha256:35777dd4aa87beee05ba64c7728a2c5e3c70687fdb654909710bac93c697efd1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate global config
        run: renovate-config-validator --strict config.json
      - name: Validate preset
        run: renovate-config-validator --strict --no-global default.json

  pre-commit:
    name: Pre-commit
    runs-on: nixos
    env:
      SKIP: gitleaks-system
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: nix develop -c gitleaks git --redact --verbose --log-opts="origin/main..HEAD"
      - name: Pre-commit
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
