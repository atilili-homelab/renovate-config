on:
  push:
    branches-ignore: [main]

name: Test

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  renovate-validate:
    name: Validate with bot version
    runs-on: podman-nix
    container: renovate/renovate:44.257.4@sha256:99cd0d7e2a6251b3dade497b1976056b3bcc3aa6738baff4810ab0f3800f4c8f
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate global config
        run: renovate-config-validator --strict config.json
      - name: Validate preset
        run: renovate-config-validator --strict --no-global default.json

  pre-commit:
    name: Pre-commit
    runs-on: nixos
    env:
      SKIP: gitleaks-system
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: nix develop -c gitleaks git --redact --verbose --log-opts="origin/main..HEAD"
      - name: Pre-commit
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
