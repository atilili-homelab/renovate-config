on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

name: Renovate scan

jobs:
  renovate-scan:
    name: Scan Homelab Repo for updates
    runs-on: podman-nix
    container: renovate/renovate:44.150.1@sha256:4355df2a8b79b7d3095c0fc4e4ea6aae958c44aeb134c4d5033e002832517ae3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Renovate
        env:
          # LOG_LEVEL: debug
          KEY_B64: ${{ secrets.RENOVATE_GIT_PRIVATE_KEY_B64 }}
          RENOVATE_CONFIG_FILE: config.json
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          DOCKER_FORGE_MACOPLA_COM_USERNAME: renovate-bot
          DOCKER_FORGE_MACOPLA_COM_PASSWORD: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          export RENOVATE_GIT_PRIVATE_KEY="$(echo "$KEY_B64" | base64 -d)"
          renovate
