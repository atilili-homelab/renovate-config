# job hebdo de nettoyage
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

name: Runner cleanup

jobs:
  prune:
    name: Prune docker engine
    runs-on: docker
    container:
      image: docker:cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00
    steps:
      - name: Prune build cache and unused images
        run: |
          docker builder prune -af
          docker image prune -af
          docker system df
